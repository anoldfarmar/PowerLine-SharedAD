# 任务合同 — M2 原型头 v0 与 k-shot 划分固化（PLAN v1.1 §2 分级实现 / §5.1 / §6 M2 行）
task: M2-proto-head-v0
plan_ref: "PLAN_v1.1.md §2 分级实现策略 v0（冻结主干+余弦原型头，改 head 不碰训练循环）；§5.1 范式内主表协议；§6 M2 行；M1 审计注记（k-shot 惯例缺失/宏类协议/类名清洗）"
gate_required: "M1_PASSED"
budget: { wall_clock_h: 72, gpu_hours: 12 }

steps:
  - "在 exp-01 安装训练依赖（torch 按租用 GPU 的 CUDA 版本、ultralytics、anomalib），GPU 自检并记录卡型/显存"
  - "数据清洗与格式转换：InsPLAD-det COCO→ultralytics YOLO 格式；归一化 FD 类名（corrosão→corrosion, normal→good）；输出清洗差异清单"
  - "训练基类检测器 YOLOv8n（s 为可选加跑），产出权重与逐类 AP；建立部件裁剪管线（检测→裁剪→FD 裁剪级输入）"
  - "k-shot 划分固化 ×3 种子：从 InsPLAD-FD 缺陷池按资产×故障组合抽取 1/5/10-shot 原型池，查询集固定；按杆塔分组防泄漏；划分文件落盘并生成清单"
  - "实现原型头 v0：冻结 YOLOv8n 主干 + P3 特征 + 类级余弦原型头（原型=特征均值聚合入库），不修改训练循环"
  - "v0 初评：1/5/10-shot ×3 种子的裁剪级缺陷召回与 AUROC（宏类合并协议生效），记录与文献上界（DifferNet 0.905）对照"
  - "写 M2 报告与指标文件，运行 accept_check 判定"

deliverables:
  - outputs/M2/data_prep_report.md
  - outputs/M2/yolov8n_det_metrics.json
  - data/splits/insplad-fd/           # ×3 种子 × {1,5,10}-shot 划分文件（本合同唯一授权写入点）
  - outputs/M2/kshot_splits_manifest.md
  - outputs/M2/proto_head_v0_report.md
  - outputs/M2/metrics.json

acceptance:
  - { type: file_exists, path: "outputs/M2/data_prep_report.md" }
  - { type: metric_min, path: "outputs/M2/yolov8n_det_metrics.json", key: "map50", min: 0.4 }
  - { type: file_exists, path: "outputs/M2/kshot_splits_manifest.md" }
  - { type: file_exists, path: "outputs/M2/proto_head_v0_report.md" }
  - { type: content_contains, path: "outputs/M2/proto_head_v0_report.md", needle: "1-shot" }
  - { type: content_contains, path: "outputs/M2/proto_head_v0_report.md", needle: "10-shot" }
  - { type: file_exists, path: "outputs/M2/metrics.json" }
  - { type: metric_min, path: "outputs/M2/metrics.json", key: "seeds", min: 3 }

forbidden:
  - "除 data/splits/insplad-fd/ 外的一切 data/splits/** 写入（k-shot 划分仅此一处，人工审批本合同即视为授权）"
  - "端到端训练循环修改（v0 限定为冻结主干 + head 模块改造，违反即触发 R1' 实现风险红线）"
  - "复现 FiLo / AnomalyCLIP（PLAN 附录：只引文献数字）"
  - "将 anomalib 基线结果与本方案 v0 做跨范式 head-to-head 结论（v0 数字仅作内部初评）"

notes:
  - "前置：需租用 GPU 实例（≥24GB 显存，4090/A5000 级）；本机为 CPU 实例无法训练"
  - "数据：/root/autodl-tmp/data/insplad（det=annotations/instances_*.json + train/；FD=defect_supervised/）；STN-PLAD 本任务不用"
  - "源码：/root/autodl-tmp/third_party/{ultralytics,anomalib}；若新实例未迁移需重新克隆"
  - "宏类合并协议：资产×故障组合为建库粒度，罕见组合并入 other-fault（PLAN §3/R6 已锁定）"
  - "yoke-suspension val/good=5742 异常池处理决策记入 data_prep_report.md"
  - "文献上界参照：DifferNet avg AUROC 0.905 / CS-Flow 0.903（论文 Table 10，5 含缺陷资产）"

human_gate_after: M2
