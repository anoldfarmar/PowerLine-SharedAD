# 草案 (DRAFT) — 待人类批准后落位 plan/tasks/M3DIAG-local-corr-v1.yaml
# 本文件由实验执行 Agent 起草于 2026-09-20; plan/ 为只读, 落位须由人类完成或明确授权
task: M3DIAG-local-corr-v1
title: 局部对应度量学习诊断 (local-correspondence vs local-supcon)
gate_required: M3_PASSED   # 未创建前禁止激活与训练
human_gate_after: M3DIAG   # 完成后报告人类, 后续是否推进同增强控制/多层融合由人类裁决
budget: {wall_clock_h: 12, gpu_hours: 2}
protocol_frozen: outputs/M3diag/frozen_protocol.json
code_prefix: scripts/m3diag_*.py (独立版本, 不改动任何 m3_* 历史代码)
output_root: outputs/M3diag/
deliverables:
  - outputs/M3diag/diag_audit.json
  - outputs/M3diag/metric_train_log_B.json
  - outputs/M3diag/metric_train_log_C.json
  - outputs/M3diag/mapper_B.pt
  - outputs/M3diag/mapper_C.pt
  - outputs/M3diag/raw_scores/
  - outputs/M3diag/diag_eval.json
  - outputs/M3diag/vis/
  - outputs/M3diag/DIAG_report.md
acceptance:
  - type: file_exists
    path: outputs/M3diag/DIAG_report.md
  - type: metric_min
    path: outputs/M3diag/diag_eval.json
    key: variants_completed
    min: 3
  - type: metric_min
    path: outputs/M3diag/diag_eval.json
    key: query_leakage_check_passed
    min: 1
forbidden:
  - 修改 plan/**, registry/gates/**, data/splits/**, 历史 M3 产物与评测协议代码
  - 目标故障 query/k-shot 参与反向传播/早停/调参/原型筛选
  - 查询评测后变更任何已冻结超参 (简报五.7)
  - 用查询分数挑选展示结果 (简报八: 全量报告含低分/失败组合)
notes: |
  B 复现 metric-v1 机制并重训 (同代码路径保证与 C 可比); A 为固定映射参照。
  本轮非单变量消融: C 同时引入双视图机制; 若 C 有明确提升, 后续由人类决定是否排同增强控制实验。
  数据边界: 度量训练帧与查询/支持源帧 ~100% 重叠为 M2 冻结既定边界, 逐配置披露;
  M3 查询集已用于研究决策, 本轮结果仅为探索性诊断。