# 草案 v3 (三组对照) — 人类已授权执行; 沿用 M3DIAG2 先例以草案路径激活
task: M3DIAG3-faultbank-p0p1-v1
title: fault prototype candidate filtering P0 / P-random / P1
status: active-draft
gate_required: M3_PASSED
human_gate_after: M3DIAG3
parent: M3DIAG-local-corr-v1 / M3DIAG2-verify-v1 (all frozen)
budget: {wall_clock_h: 2, gpu_hours: 1}   # v3 更新: 加入 P-random 后估算 ~35 GPU 分钟, 上限 1h
scope:
  combos: [glass-insulator/missing-cap, yoke-suspension/rust]   # 严格隔离可行资产
  mapper: mapper_B.pt 固定; P3 特征缓存逐位一致; L2 归一化不变
  splits: 冻结 query_k{1,5,10}.json + kshot_k{1,5,10}_seed{0,1,2}.json 原样
arms:
  P0: 全部故障支持 patch 入候选池 -> 既有 FPS coreset(256, seed 0)
  P-random: 与 P1 同一候选池, 预注册种子固定随机无放回保留 50% (数量与 P1 完全相同) -> 同 coreset
  P1: s(p)=1-max_r cos(p,r) (r=同资产正常参考库256向量), 按 s 降序保留 50% -> 同 coreset
pre_registered_rules:
  normal_ref_draw: 候选(严格隔离池)按文件名排序后 np.random.default_rng(3000) 无放回抽 10 张/资产; 全部 k/种子/组固定
  normal_ref_bank: 10 张全网格 patch -> mapper_B -> L2 -> FPS coreset(256, seed 0); 每资产一次, 不重抽
  p1_keep: n_keep = N_pool // 2 (整除); 同分按 patch 索引升序 (stable argsort on -s)
  prandom_seed: np.random.default_rng(4000) 每 (组合,k,支持种子) 独立同种子抽取
  coreset: coreset_farthest(seed 0), 三组相同
  insufficiency: 最终预算 = min(256, n_keep) 对三组一致适用 (当前最小池 1600 -> keep 800, 不会触发)
  p0_repro_gate: 与旧 outputs/M3diag/raw_scores/B_*.json 逐路径分数比对, max|diff|<=1e-4, 否则停止并解释
  metrics: 平均秩 AUROC (同分平均秩); 拒绝非有限分数; std ddof=0
checks_before_eval:
  - 权重/划分/正常参照清单 sha256 核验
  - 三组同一候选特征矩阵 (仅索引筛选)
  - P-random/P1 保留数量一致; 三组最终原型数一致
  - P1 筛选只读支持图与正常参照, 不读查询标签/分数
  - 特征/分数/距离无 NaN/Inf
constraints:
  - 正常参照只用于筛选, 不直接加入故障库
  - 不训练/不换骨干/不加注意力或融合; 不按结果调筛选比例; 不重抽正常参照
  - 严格隔离仅针对新增正常参照; 整体仍继承源帧重叠边界, 探索性
  - P1-disclosed 不在本轮运行; 其余三资产记录缺口
diagnostics:
  - 库内最近邻余弦(排除自匹配); 原型来源图数量与贡献比例; 原型空间位置分布
  - P1 保留 vs 被排除候选的正常距离分布
  - 固定可视化样本 (k=5 seed=0 每组合排序首个支持图, 不挑选): 三组候选/原型位置
deliverables:
  - outputs/M3diag3/normal_ref.json
  - outputs/M3diag3/data_audit.json
  - outputs/M3diag3/faultbank_eval.json
  - outputs/M3diag3/raw_scores3/
  - outputs/M3diag3/bank_meta/
  - outputs/M3diag3/vis/
  - outputs/M3diag3/FAULTBANK_report.md
acceptance:
  - type: file_exists
    path: outputs/M3diag3/FAULTBANK_report.md
  - type: file_exists
    path: outputs/M3diag3/faultbank_eval.json
  - type: metric_min
    path: outputs/M3diag3/faultbank_eval.json
    key: arms_completed
    min: 3
