task: InsPLAD-sharedROI-C-vis20-v1
title: Twenty C detector-box and anomaly-distance inspection panels
authorized_by: User requested 20 visualizations for inspection
gate_required: null
scope:
  input: Completed InsPLAD-sharedROI-ABC-ref3001-v1 saved C boxes, features, normal banks and raw scores
  selection: Five assets x (one normal with box, two faults with box covering fault types, one fault fallback); SHA256 seed+path, no score selection
  compute: CPU only, official Euclidean kernel on cached normalized ROI features; no model forwards, training or reevaluation
  display: Viridis, per-asset fixed normal12 query99.5percentile scale; project into actual ROI in native image coordinates
  outputs: Twenty four-panel PNGs, 20-page PDF, overview, ZIP, raw maps, manifest and score-equivalence checks
forbidden:
  - Changing original experiment files, memory banks, frozen splits, image scores or thresholds
  - Claiming pixel GT, detection correctness, attention probabilities or representative fallback prevalence
  - Substituting a full-image display for an actual predicted ROI without identifying fallback
